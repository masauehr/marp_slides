<svg width="760" height="820" viewBox="0 0 760 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>作業フォルダを中心に自然言語でのコード生成・マニュアル化・自動実行の日々確認・アプリ高度化が双方向につながる開発サイクルのポンチ絵</title>
<desc>中心に置いた作業フォルダ（コード・マニュアル・ルールを蓄積する場所）を軸に、①自然言語でコード生成して試作品を高速に作る、②その過程を毎回マニュアル化する、③GitHubへpushしたコードを定時実行などで何でも自動化し、その結果を人がスマホを持って日々確認する、④スマホでの確認から生まれた新しいアイデアやバグ発見をもとに、フォルダを読み込んでアプリ高度化・バグ修正を続ける、という4つの工程がすべてフォルダとの間で情報を読み書きする様子を、中心のフォルダと4つの衛星ノードを結ぶ双方向矢印、および①→②→③→④→①と外周を巡る循環矢印で表した図。③の人物アイコンには「新しいアイデア・バグ発見」という吹き出しを添えている。</desc>
<defs>
<marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowCycle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="760" height="820" fill="#ffffff"/>

<g transform="translate(0,90)">

<!-- 外周：①→②→③→④→①の循環矢印 -->
<path d="M424,154 Q530,190 566,296" fill="none" stroke="#3d3d3a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrowCycle)" opacity="0.75"/>
<path d="M566,384 Q530,490 424,526" fill="none" stroke="#3d3d3a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrowCycle)" opacity="0.75"/>
<path d="M336,526 Q230,490 194,384" fill="none" stroke="#3d3d3a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrowCycle)" opacity="0.75"/>

<path d="M194,296 Q230,190 336,154" fill="none" stroke="#3d3d3a" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrowCycle)" opacity="0.75"/>

<!-- 中心⇄各衛星の双方向矢印 -->
<line x1="380" y1="262" x2="380" y2="172" stroke="#5F5E5A" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
<line x1="458" y1="340" x2="548" y2="340" stroke="#5F5E5A" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
<line x1="380" y1="418" x2="380" y2="508" stroke="#5F5E5A" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
<line x1="302" y1="340" x2="212" y2="340" stroke="#5F5E5A" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>

<!-- 中心：作業フォルダ -->
<circle cx="380" cy="340" r="78" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<g transform="translate(380,293) scale(1.15)">
<rect x="-30" y="-4" width="60" height="32" rx="4" fill="#3d3d3a"/>
<path d="M-30,-4 L-30,-14 Q-30,-16 -28,-16 L-6,-16 Q-3,-16 -1,-13 L3,-6 L-30,-6 Z" fill="#3d3d3a"/>
<rect x="-24" y="2" width="48" height="20" rx="2" fill="#ffffff"/>
</g>
<text x="380" y="350" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#3d3d3a">作業フォルダ</text>
<text x="380" y="373" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#5F5E5A">コード・マニュアル・</text>
<text x="380" y="391" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#5F5E5A">ルールを蓄積</text>

<!-- 1. 自然言語で指示（北）：ラベルは中心と反対の上側に配置 -->
<text x="380" y="4" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0B6B49">自然言語でコード生成</text>
<text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#128F63">試作品を高速に作成</text>
<circle cx="380" cy="110" r="62" fill="#E3F7EE" stroke="#1baf7a" stroke-width="0.5"/>
<g transform="translate(380,110)">
<path d="M-24,-16 Q-27,-16 -27,-13 L-27,3 Q-27,7 -24,7 L-11,7 L-4,17 L0,7 L24,7 Q27,7 27,3 L27,-13 Q27,-16 24,-16 Z" fill="#3d3d3a"/>
<path d="M-13,-7 L-18,-2 L-13,3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M2,-10 L-2,6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<path d="M9,-7 L14,-2 L9,3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<circle cx="424" cy="66" r="16" fill="#0B6B49"/>
<text x="424" y="72" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>

<!-- 2. マニュアル化（東） -->
<circle cx="610" cy="340" r="62" fill="#FCEFD6" stroke="#eda100" stroke-width="0.5"/>
<g transform="translate(610,340)">
<rect x="-16" y="-22" width="32" height="42" rx="3" fill="#3d3d3a"/>
<line x1="-9" y1="-11" x2="9" y2="-11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<line x1="-9" y1="-3" x2="9" y2="-3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<line x1="-9" y1="5" x2="3" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<path d="M4,18 L20,2" stroke="#3d3d3a" stroke-width="5.5" stroke-linecap="round"/>
<path d="M20,2 L25,-3 L21,-7 L16,-2 Z" fill="#3d3d3a"/>
</g>
<circle cx="654" cy="296" r="16" fill="#7A5200"/>
<text x="654" y="302" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
<text x="610" y="430" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#7A5200">毎回マニュアル化</text>
<text x="610" y="456" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#B37600">AIになら気兼ねなく指示</text>

<!-- 3. スケジュール実行を日々確認（南） -->
<circle cx="380" cy="570" r="62" fill="#E3EEFB" stroke="#2a78d6" stroke-width="0.5"/>
<g transform="translate(380,570)">
<path d="M-25,7 Q-30,-5 -16,-7 Q-13,-18 2,-16 Q13,-23 21,-13 Q32,-13 30,0 Q36,9 25,11 L-21,11 Q-28,11 -25,7 Z" fill="#3d3d3a"/>
<path d="M0,-4 L0,9 M-5,2 L0,-4 L5,2" fill="none" stroke="#E3EEFB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<circle cx="424" cy="614" r="16" fill="#1B4A82"/>
<text x="424" y="620" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
<circle cx="336" cy="614" r="19" fill="#1B4A82"/>
<g transform="translate(336,614)">
<circle cx="-3" cy="-9" r="4.3" fill="#ffffff"/>
<path d="M-10,12 Q-10,-3 -3,-3 Q4,-3 4,12 Z" fill="#ffffff"/>
<rect x="1" y="-8" width="6.5" height="11" rx="1.3" fill="#1B4A82"/>
<rect x="2.3" y="-6.3" width="3.9" height="7" rx="0.6" fill="#ffffff" opacity="0.4"/>
</g>
<!-- ③の人物アイコンに添える吹き出し：新しいアイデア・バグ発見 -->
<path d="M283,593 L336,614 L303,593 Z" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.2"/>
<rect x="168" y="545" width="140" height="48" rx="14" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="238" y="567" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#3d3d3a">新しいアイデア</text>
<text x="238" y="585" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#3d3d3a">バグ発見</text>
<text x="380" y="658" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#1B4A82">スケジュール実行を日々確認</text>
<text x="380" y="684" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2a78d6">GitHubへ自動push</text>
<text x="380" y="704" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#2a78d6">何でも自動化</text>

<!-- 4. 次回の作業（西） -->
<circle cx="150" cy="340" r="62" fill="#ECE9FB" stroke="#4a3aa7" stroke-width="0.5"/>
<g transform="translate(150,340)">
<path d="M-14,-18 Q0,-27 18,-13" fill="none" stroke="#3d3d3a" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrowB)"/>
<path d="M18,4 Q9,22 -12,18" fill="none" stroke="#3d3d3a" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrowB)"/>
</g>
<circle cx="194" cy="296" r="16" fill="#3C3489"/>
<text x="194" y="302" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">4</text>
<text x="150" y="430" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#3C3489">アプリ高度化</text>
<text x="150" y="457" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#3C3489">バグ修正</text>
<text x="150" y="483" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4a3aa7">フォルダを読んで続きへ</text>

</g>
</svg>
